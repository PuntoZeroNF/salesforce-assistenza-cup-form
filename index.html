<!DOCTYPE html>
<html lang="it">
<head>
    <meta http-equiv="Content-type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Richiesta Assistenza NUS - PuntoZero</title>

    <!-- Google reCAPTCHA -->
    <script src="https://www.google.com/recaptcha/api.js"></script>

    <script>
        // Timestamp richiesto da Salesforce
        function timestamp() {
            var response = document.getElementById("g-recaptcha-response");
            if (response == null || response.value.trim() === "") {
                var elems = JSON.parse(document.getElementsByName("captcha_settings")[0].value);
                elems["ts"] = JSON.stringify(new Date().getTime());
                document.getElementsByName("captcha_settings")[0].value = JSON.stringify(elems);
            }
        }
        setInterval(timestamp, 500);

        // Validazione form
        function validateForm() {
            var recaptcha = grecaptcha.getResponse();
            var errorDiv = document.getElementById("recaptcha-error");

            if (recaptcha.length === 0) {
                errorDiv.style.display = "block";
                return false;
            }

            errorDiv.style.display = "none";
            return true;
        }
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            color: #003087;
            font-size: 2.2em;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 1.1em;
        }

        .form-section {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            padding: 40px;
        }

        label {
            display: block;
            font-weight: 600;
            color: #003087;
            margin-bottom: 8px;
        }

        input, textarea {
            width: 100%;
            padding: 14px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 1em;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #003087;
            box-shadow: 0 0 0 3px rgba(0,48,135,0.1);
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        .row {
            display: flex;
            gap: 20px;
        }

        .row > div {
            flex: 1;
        }

        .submit-btn {
            background: linear-gradient(135deg, #003087, #0056b3);
            color: white;
            padding: 16px;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            cursor: pointer;
            width: 100%;
        }

        .submit-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(0,48,135,0.3);
        }

        .recaptcha-error {
            color: #d93025;
            font-weight: 600;
            display: none;
            margin-bottom: 20px;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            font-size: 0.9em;
            color: #666;
        }

        @media (max-width: 768px) {
            .row { flex-direction: column; }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>🩺 Assistenza prenotazioni CUP</h1>
        <p>Compila il modulo per richiedere supporto</p>
    </div>

    <div class="form-section">

        <form action="https://webto.salesforce.com/servlet/servlet.WebToCase?encoding=UTF-8&orgId=00D0900000DXY9A"
              method="POST"
              onsubmit="return validateForm()">

            <!-- Salesforce hidden fields -->
            <input type="hidden" name="captcha_settings"
                   value='{"keyname":"PuntoZero_Salesforce_WebToCase","fallback":"true","orgId":"00D0900000DXY9A","ts":""}'>

            <input type="hidden" name="orgid" value="00D0900000DXY9A">
            <input type="hidden" name="retURL" value="https://assistenza.puntozeroscarl.it/s/">
            <input type="hidden" id="external" name="external" value="1">

            <div class="row">
                <div>
                    <label>Nome *</label>
                    <input name="00N0900000NR5QI" maxlength="20" required>
                </div>
                <div>
                    <label>Cognome *</label>
                    <input name="00N0900000NR5Pj" maxlength="20" required>
                </div>
            </div>

            <label>Telefono *</label>
            <input name="phone" type="tel" required>

            <label>Email</label>
            <input name="email" type="email">

            <label>Codice Fiscale *</label>
            <input name="00N0900000NR5Pe" maxlength="20" required>

            <label>Numero Ricetta Elettronica (NRE) *</label>
            <input name="00Nc3000007563y" maxlength="15" required>

            <label>Descrizione *</label>
            <textarea name="description" required></textarea>

            <!-- reCAPTCHA -->
            <div class="g-recaptcha"
                 data-sitekey="6LeOtW8sAAAAALB7lkqfLtG7769RMuDgfWzOqQRv"></div>

            <div id="recaptcha-error" class="recaptcha-error">
                ⚠️ Completa il reCAPTCHA
            </div>

            <button type="submit" class="submit-btn">
                Invia richiesta
            </button>

        </form>
    </div>

    <div class="footer">
        © 2026 PuntoZero S.C.A.R.L. |
        <a href="https://puntozeroscarl.it/">Torna alla home</a>
    </div>

</div>

</body>
</html>
